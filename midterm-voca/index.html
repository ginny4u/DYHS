<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동양고 어휘·성어 반복학습</title>
<meta name="description" content="동양고 1학년 2학기 중간고사 범위 교과서 날개 어휘와 한자 성어 반복학습">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 레이아웃: 한 줄 폭(최대 640px)의 단일 학습 지면. 머리말 → 범위 고르기 → 문제 카드. 헤어라인과 점토색 포인트 하나. */
:root{
  --bg:#f6f6f4; --paper:#ffffff; --ink:#1c1b1a; --muted:#6b6863; --rule:#dcd9d4;
  --accent:#b0503a; --accent-soft:#f3e3dd; --plate:#ece8e1; --good:#2f6b4f; --good-soft:#e2efe8;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ohg:"Noto Serif CJK KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151514; --paper:#1d1c1b; --ink:#ecebe7; --muted:#a19d97; --rule:#36332f;
  --accent:#de7d62; --accent-soft:#3a2520; --good:#6fbf95; --good-soft:#1d3329; --plate:#e6e1d9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151514; --paper:#1d1c1b; --ink:#ecebe7; --muted:#a19d97; --rule:#36332f;
  --accent:#de7d62; --accent-soft:#3a2520; --good:#6fbf95; --good-soft:#1d3329; --plate:#e6e1d9; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ohg{font-family:var(--ohg)}
.og{height:1em;vertical-align:-0.14em;display:inline-block;overflow:visible}
.hz{font-family:var(--serif);color:var(--muted);font-weight:500}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:22px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.3rem;letter-spacing:-.01em;text-wrap:balance;margin:0;cursor:pointer}
.brand .heart{color:var(--accent);margin-right:6px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.85rem;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

h2.sec{font-size:.78rem;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:28px 0 10px}
.hero{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;margin-bottom:18px}
.char{width:104px;display:grid;place-items:center}
.char img{width:100%;height:auto;display:block;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.char.sm{width:64px}
.bubble{justify-self:start;width:fit-content;max-width:100%;position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;font-size:.95rem;line-height:1.55}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--paper);border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:translateY(-50%) rotate(45deg)}
.endhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.how{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;display:grid;gap:6px;font-size:.92rem}
.how div{display:grid;grid-template-columns:22px 1fr;gap:4px}
.how .num{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}

.groups{display:grid;gap:0}
.grp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.grp input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.grp .name{font-weight:600}
.grp .sub{font-size:.8rem;color:var(--muted)}
.meter{grid-column:2/4;height:4px;background:var(--rule);border-radius:2px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m{background:var(--good)} .meter .l{background:var(--accent)}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{border:1px solid var(--ink);background:var(--paper);border-radius:10px;padding:14px 12px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{grid-column:1/-1}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}

/* 문제 */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.bar{height:3px;background:var(--rule);margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.kind{display:inline-block;font-size:.75rem;letter-spacing:.06em;color:var(--accent);font-weight:600;margin-bottom:6px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:20px 18px}
.prompt{font-size:1.05rem;margin:0 0 4px;text-wrap:pretty}
.word{font-family:var(--serif);font-size:1.9rem;font-weight:700;line-height:1.3;margin:6px 0 2px;word-break:keep-all}
.ctx{font-family:var(--serif);font-size:1.05rem;line-height:1.8;border-left:2px solid var(--rule);padding-left:12px;margin:8px 0 0;word-break:keep-all}
.ctx .blank{display:inline-block;min-width:4.5em;border-bottom:1.5px solid var(--accent);text-align:center;color:var(--accent)}
.sent{font-size:1.05rem;line-height:1.75;margin:8px 0 0}
.sent mark{background:none;color:inherit;border-bottom:2px solid var(--accent);font-weight:600}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:12px;line-height:1.55}
.opt .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.opt.big{font-family:var(--serif);font-size:1.15rem;font-weight:700}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ox .opt{grid-template-columns:1fr;text-align:center;font-weight:600}
.typing{display:flex;gap:8px;margin-top:16px}
.typing input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}
.typing .btn{padding:12px 16px}

.fb{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px;display:grid;gap:6px}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--good)} .fb .verdict.no{color:var(--accent)}
.fb .term{font-family:var(--serif);font-weight:700;font-size:1.15rem}
.fb .why{font-size:.95rem}
.fb .note{font-size:.82rem;color:var(--muted)}
.star{color:var(--accent);font-size:.78rem;font-weight:600;letter-spacing:.04em;margin-left:6px;white-space:nowrap}
.next{margin-top:14px;width:100%}

/* 결과 */
.score{font-family:var(--serif);font-size:3rem;font-weight:700;line-height:1;margin:6px 0}
.score small{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:500}
.miss{display:grid;border-top:1px solid var(--rule)}
.miss div{padding:10px 0;border-bottom:1px solid var(--rule)}
.miss .t{font-family:var(--serif);font-weight:700;color:var(--accent)}

/* 어휘장 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.tabs .chip{white-space:nowrap}
.list{border-top:1px solid var(--ink)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.item .t{font-family:var(--serif);font-weight:700;font-size:1.08rem;word-break:keep-all}
.item .m{grid-column:1/-1;font-size:.94rem;transition:filter .15s}
.item .m.hide{filter:blur(6px);user-select:none}
.dots{display:flex;gap:3px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--good)}
.sit{font-size:.82rem;color:var(--muted);grid-column:1/-1}
.confirm{border:1px solid var(--accent);border-radius:10px;padding:12px;margin-top:12px;display:grid;gap:10px;font-size:.92rem}
footer{margin-top:40px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

</div>

  {k:'sijo', name:'가시리 · 시조 세 편', sub:'고려 가요·시조 날개 어휘'},
  {k:'sang', name:'상춘곡', sub:'날개 어휘 · 어휘력 키우기'},
  {k:'heung', name:'흥보전', sub:'날개 어휘 (★ 2025 기말 기출)'},
  {k:'ai', name:'주제 통합 읽기 (인공 지능)', sub:'날개 어휘 + 지문 어휘 (★ 2025 중간 기출)'},
  {k:'idiom', name:'한자 성어', sub:'범위 작품 성어 + 동양고 기출 성어'}
];
ITEMS.forEach((it,i)=>{ it.id = it.g+':'+it.w; it.i=i; });

/* ---------- 저장 (이 기기에만) */
const KEY='dongyang-vocab-2-mid-v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let store = load();
store.p = store.p || {}; store.sel = store.sel || ['sijo','sang','heung','ai','idiom']; store.n = [5,10,15].includes(store.n) ? store.n : 10;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const P = id => (store.p[id] = store.p[id] || {b:0, w:0, last:0, miss:false});

/* ---------- 도우미 */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const og = (s, k) => String(s).split(/(\s+)/).map(t => (OG[k] && OG[k][t]) || esc(t)).join('');
const wordHTML = it => it.ohg ? og(it.w,'b') : esc(it.w);
const hasOld = s => /[ᄀ-ᇿꥠ-꥿ힰ-퟿]/.test(s);
const txt = s => hasOld(s) ? og(s,'r') : esc(s);
function pool(){
  return ITEMS.filter(it => store.sel.includes(it.g));
}
function stats(list){
  let m=0,l=0; list.forEach(it=>{ const b=(store.p[it.id]||{}).b||0; if(b>=4) m++; else if(b>0) l++; });
  return {m,l,n:list.length};
}

/* ---------- 문제 만들기
   익힘 단계(0~5)에 따라 문제 형태를 바꾼다.
   0~1: 뜻 ↔ 어휘 4지선다 / 2: 원문 빈칸·작품 상황 / 3 이상: 활용 문장 O/X, 뜻 보고 직접 쓰기 */
function distract(it, n, key){
  let same = ITEMS.filter(x => x.g===it.g && x.id!==it.id && x[key]!==it[key]);
  if(key==='w') same = same.filter(x => !x.ohg === !it.ohg);
  // 같은 갈래(인물·관직·옷감·성어 등)에서 먼저 골라 헷갈리게
  const near = shuffle(same.filter(x => x.k && x.k===it.k));
  const rest = shuffle(same.filter(x => !(x.k && x.k===it.k)));
  return near.concat(rest).slice(0, n);
}
function makeQ(it, forceEasy){
  const b = forceEasy ? 0 : (P(it.id).b);
  const kinds = [];
  if(b<=1){ kinds.push('w2m','m2w'); }
  else if(b===2){
    if(it.ctx && it.g!=='idiom') kinds.push('ctx');
    if(it.sit) kinds.push('sit');
    if(!kinds.length) kinds.push('m2w');
  } else {
    if(it.use.length) kinds.push('use');
    if(!it.ohg && it.w.length<=12) kinds.push('type');
    if(it.ctx && it.g!=='idiom') kinds.push('ctx');
    if(!kinds.length) kinds.push('m2w');
  }
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  const q = {it, kind};
  if(kind==='w2m'){ q.opts = shuffle([it, ...distract(it,3,'m')]); }
  if(kind==='m2w' || kind==='ctx' || kind==='sit'){
    let ds = distract(it,3,'w');
    if(kind==='ctx') ds = sample(ITEMS.filter(x=>x.g===it.g && x.id!==it.id && !x.ohg), 3);
    q.opts = shuffle([it, ...ds]);
  }
  if(kind==='use'){ q.use = it.use[Math.floor(Math.random()*it.use.length)]; }
  return q;
}

/* ---------- 세션 */
let S = null;
function startSession(mode){
  let list = pool();
  if(mode==='miss') list = list.filter(it => (store.p[it.id]||{}).miss);
  if(!list.length) return;
  const now = Date.now();
  // 익힘 단계가 낮고 오래 안 본 낱말부터. 같은 조건이면 무작위.
  const ranked = shuffle(list).sort((a,b)=>{
    const pa=P(a.id), pb=P(b.id);
    if(pa.miss!==pb.miss) return pa.miss? -1:1;
    if(pa.b!==pb.b) return pa.b-pb.b;
    return (pa.last||0)-(pb.last||0);
  });
  const N = Math.min(store.n, ranked.length);
  const pick = ranked.slice(0,N);
  S = {mode, queue: pick.map(it=>makeQ(it)), done:0, right:0, total:pick.length, missed:[], startedAt:now};
  renderQ();
}
function answer(ok, extraWhy){
  const q = S.queue[0]; const it=q.it; const p=P(it.id);
  if(S.answered) return; S.answered = true;
  p.last = Date.now();
  if(ok){
    S.right++;
    if(!q.retry){ p.b = Math.min(5, p.b+1); p.miss=false; }
    else { p.b = Math.max(p.b,1); }
  } else {
    p.w++; p.b = 1; p.miss = true;
    if(!S.missed.includes(it)) S.missed.push(it);
    // 틀린 낱말은 세 문제 뒤에 쉬운 형태로 한 번 더
    // 문제 수는 늘리지 않음: 맨 뒤 새 문제 하나를 빼고 그 자리에 다시 넣는다(빠진 낱말은 다음 판에 나옴)
    const rest = S.queue.slice(1);
    let drop = -1; for(let i=rest.length-1;i>=0;i--){ if(!rest[i].retry){ drop=i; break; } }
    if(drop >= 0){
      S.queue.splice(drop+1, 1);
      const re = makeQ(it, true); re.retry = true;
      S.queue.splice(Math.min(3, S.queue.length), 0, re);
    }
  }
  save();
  showFeedback(ok, extraWhy);
}
function nextQ(){
  S.queue.shift(); S.done++;
  S.answered=false;
  if(!S.queue.length) return renderEnd();
  renderQ();
}

/* ---------- 화면: 처음 */
function renderHome(){
  S=null;
  const all = pool();
  const missN = all.filter(it=>(store.p[it.id]||{}).miss).length;
  const groupsHTML = GROUPS.map(g=>{
    const list = ITEMS.filter(it=>it.g===g.k);
    const s = stats(list);
    const on = store.sel.includes(g.k);
    return `<label class="grp" for="g-${g.k}">
      <input type="checkbox" id="g-${g.k}" data-g="${g.k}" ${on?'checked':''}>
      <span><span class="name">${g.name}</span><br><span class="sub">${g.sub}</span></span>
      <span class="count">학습완료 ${s.m} / ${s.n}</span>
      <span class="meter" aria-hidden="true"><i class="m" style="width:${s.n?s.m/s.n*100:0}%"></i><i class="l" style="width:${s.n?s.l/s.n*100:0}%"></i></span>
    </label>`;
  }).join('');
  $('#app').innerHTML = `
    <div class="hero">${charHTML()}<div class="bubble">시험 날 아침에 후회하지 말고 지금 해</div></div>
    <section class="how" aria-label="공부 방법">
      <div><span class="num">1</span><span>처음 보는 단어는 4지선다부터</span></div>
      <div><span class="num">2</span><span>반복할수록 빈칸 → 문장 활용 → 직접 채우기</span></div>
      <div><span class="num">3</span><span>틀린 단어는 세 문제 뒤에 또 나옴</span></div>
    </section>
    <div class="row" style="justify-content:space-between;margin:28px 0 4px"><h2 class="sec" style="margin:0">범위</h2><button class="chip" id="sel-all" type="button">${store.sel.length===GROUPS.length?'전체 해제':'전체 선택'}</button></div>
    <div class="groups">${groupsHTML}</div>
    <div class="legend"><span style="--c:var(--good)">학습완료</span><span style="--c:var(--accent)">공부 중</span></div>
    <h2 class="sec">한 번에 풀 문제 수</h2>
    <div class="row" role="group" aria-label="한 번에 풀 문제 수">${[5,10,15].map(n=>`<button class="chip" type="button" data-n="${n}" aria-pressed="${store.n===n}">${n}문제</button>`).join('')}</div>
    <div class="actions">
      <button class="btn primary" id="start" type="button" ${all.length?'':'disabled'}>공부 시작 · ${Math.min(store.n,all.length)}문제</button>
      <button class="btn" id="start-miss" type="button" ${missN?'':'disabled'}>틀린 것만 · ${missN}개</button>
    </div>
    <div style="margin-top:18px"><button class="linkbtn" id="reset" type="button">공부 기록 지우기</button><div id="reset-box"></div></div>`;
  document.querySelectorAll('[data-g]').forEach(el=>el.addEventListener('change',e=>{
    const k=e.target.dataset.g; store.sel = e.target.checked ? [...new Set([...store.sel,k])] : store.sel.filter(x=>x!==k);
    save(); renderHome();
  }));
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{store.n=+b.dataset.n;save();renderHome();});
  $('#sel-all').onclick=()=>{ store.sel = store.sel.length===GROUPS.length ? [] : GROUPS.map(g=>g.k); save(); renderHome(); };
  $('#start').onclick=()=>startSession('learn');
  $('#start-miss').onclick=()=>startSession('miss');
  $('#reset').onclick=()=>{
    $('#reset-box').innerHTML=`<div class="confirm">공부 기록이 전부 사라짐. 진짜 지울 거임?<div class="row"><button class="btn primary" id="reset-yes" type="button">지우기</button><button class="btn" id="reset-no" type="button">그대로 두기</button></div></div>`;
    $('#reset-yes').onclick=()=>{store.p={};save();renderHome();};
    $('#reset-no').onclick=()=>{$('#reset-box').innerHTML='';};
  };
}

/* ---------- 화면: 문제 */
const KIND_LABEL = {w2m:'어휘 → 뜻', m2w:'뜻 → 어휘', ctx:'원문 빈칸', sit:'작품 상황 → 한자 성어', use:'활용 문장', type:'직접 쓰기'};
function renderQ(){
  const q=S.queue[0], it=q.it;
  const pct = S.done/S.total*100;
  let body='';
  if(q.kind==='w2m'){
    body = `<p class="prompt">다음 어휘의 뜻은?</p>
      <div class="word">${wordHTML(it)} ${it.h?`<span class="hz">${esc(it.h)}</span>`:''}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="n">${i+1}</span><span>${esc(o.m)}</span></button>`).join('')}</div>`;
  } else if(q.kind==='m2w'){
    body = `<p class="prompt">뜻에 맞는 ${it.g==='idiom'?'한자 성어':'어휘'}는?</p>
      <p class="sent">${esc(it.m)}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt big" type="button" data-i="${i}"><span class="n">${i+1}</span><span>${wordHTML(o)}</span></button>`).join('')}</div>`;
  } else if(q.kind==='ctx'){
    const re = new RegExp(it.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(\\([^)]*\\))?');
    const mt = it.ctx.match(re);
    const shown = txt(it.ctx.slice(0, mt.index)) + '<span class="blank">(&nbsp;&nbsp;&nbsp;)</span>' + txt(it.ctx.slice(mt.index + mt[0].length));
    body = `<p class="prompt">원문의 빈칸에 들어갈 어휘는?</p>
      <p class="ctx">${shown}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt big" type="button" data-i="${i}"><span class="n">${i+1}</span><span>${wordHTML(o)}</span></button>`).join('')}</div>`;
  } else if(q.kind==='sit'){
    body = `<p class="prompt">다음 상황에 어울리는 한자 성어는?</p>
      <p class="sent">${esc(it.sit)}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt big" type="button" data-i="${i}"><span class="n">${i+1}</span><span>${esc(o.w)}</span></button>`).join('')}</div>`;
  } else if(q.kind==='use'){
    const s = esc(q.use[0]).replace(esc(it.w), `<mark>${esc(it.w)}</mark>`);
    body = `<p class="prompt">‘${esc(it.w)}’을/를 뜻에 맞게 활용한 문장인가요?</p>
      <p class="sent">${s}</p>
      <div class="ox"><button class="opt" type="button" data-ox="1">바르게 썼다</button><button class="opt" type="button" data-ox="0">잘못 썼다</button></div>`;
  } else if(q.kind==='type'){
    body = `<p class="prompt">뜻을 보고 ${it.g==='idiom'?'한자 성어':'어휘'}를 직접 쓰세요.</p>
      <p class="sent">${esc(it.m)}</p>
      ${it.sit?`<p class="sit" style="margin:4px 0 0">${esc(it.sit)}</p>`:''}
      <form class="typing" id="type-form"><input id="type-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="답 쓰기" placeholder="${it.w.length}글자"><button class="btn primary" type="submit">확인</button></form>`;
  }
  $('#app').innerHTML = `
    <div class="qhead"><span>${S.mode==='miss'?'틀린 것만':'공부'} · ${Math.min(S.done+1,S.total)} / ${S.total}${q.retry?' · 다시':''}</span><button class="linkbtn" id="quit" type="button">그만하기</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card"><span class="kind">${KIND_LABEL[q.kind]}</span>${body}<div id="fb"></div></div>`;
  $('#quit').onclick=renderHome;
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const o=q.opts[+b.dataset.i]; const ok = o.id===it.id;
    document.querySelectorAll('[data-i]').forEach(x=>{ x.disabled=true; const oo=q.opts[+x.dataset.i]; if(oo.id===it.id) x.classList.add('correct'); });
    if(!ok) b.classList.add('wrong');
    answer(ok, ok ? '' : (q.kind==='w2m' ? `고른 뜻은 ‘${o.w}’의 뜻입니다.` : `고른 답 ‘${o.w}’: ${o.m}`));
  });
  document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>{
    const said = b.dataset.ox==='1'; const ok = said===q.use[1];
    document.querySelectorAll('[data-ox]').forEach(x=>{ x.disabled=true; if((x.dataset.ox==='1')===q.use[1]) x.classList.add('correct'); });
    if(!ok) b.classList.add('wrong');
    answer(ok, q.use[1] ? '뜻에 맞게 쓴 문장입니다.' : q.use[2]);
  });
  const f=$('#type-form');
  if(f){ $('#type-in').focus(); f.onsubmit=e=>{ e.preventDefault(); if(S.answered) return;
    const v=$('#type-in').value.replace(/\s/g,''); const ok = v===it.w.replace(/\s/g,'');
    $('#type-in').disabled=true; answer(ok, ok?'':`쓴 답: ${v||'(빈칸)'}`); }; }
}
function showFeedback(ok, why){
  const it=S.queue[0].it;
  $('#fb').innerHTML = `<div class="fb">
    <div class="verdict ${ok?'ok':'no'}">${ok?'♥ 정답':(S.queue.slice(1).some(x=>x.retry && x.it===it) ? '오답 · 세 문제 뒤에 다시 나옴' : '오답 · ‘틀린 것만’에 저장됨')}</div>
    <div class="term">${wordHTML(it)} ${it.h?`<span class="hz">${esc(it.h)}</span>`:''}${it.star?'<span class="star">★ 동양고 기출</span>':''}</div>
    <div class="why">${esc(it.m)}</div>
    ${why?`<div class="note">${esc(why)}</div>`:''}
    ${it.note?`<div class="note">${txt(it.note)}</div>`:''}
    <button class="btn primary next" id="next" type="button">다음</button></div>`;
  $('#next').onclick=nextQ; $('#next').focus();
}

/* ---------- 화면: 끝 */
function renderEnd(){
  const m=S.missed;
  $('#app').innerHTML = `
    <div class="endhead">${charHTML('sm')}<div class="score">${S.right}<small> / ${S.total}</small></div></div>
    ${m.length?`<h2 class="sec">틀린 단어</h2>
      <div class="miss">${m.map(it=>`<div><span class="t">${wordHTML(it)}</span> ${it.h?`<span class="hz">${esc(it.h)}</span>`:''}<br>${esc(it.m)}</div>`).join('')}</div>`
      :''}
    <div class="actions">
      <button class="btn primary" id="again" type="button">한 판 더</button>
      <button class="btn" id="again-miss" type="button" ${m.length?'':'disabled'}>틀린 것만 다시</button>
      <button class="btn wide" id="home" type="button">처음으로</button>
    </div>`;
  $('#again').onclick=()=>startSession('learn');
  $('#again-miss').onclick=()=>startSession('miss');
  $('#home').onclick=renderHome;
}

/* ---------- 화면: 어휘장 */
let bookTab='sijo', bookHide=false;
function renderBook(){
  S=null;
  const list = ITEMS.filter(it=>it.g===bookTab);
  $('#app').innerHTML = `
    <div class="tabs" role="tablist">${GROUPS.map(g=>`<button class="chip" role="tab" type="button" data-tab="${g.k}" aria-pressed="${g.k===bookTab}">${g.name}</button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="count">${list.length}개 · ★ 동양고 기출 · 점은 학습 단계</span>
      <button class="chip" id="hide" type="button" aria-pressed="${bookHide}">뜻 가리기</button>
    </div>
    <div class="list">${list.map(it=>{ const b=(store.p[it.id]||{}).b||0;
      return `<div class="item" data-id="${esc(it.id)}">
        <span class="t">${wordHTML(it)} ${it.h?`<span class="hz">${esc(it.h)}</span>`:''}${it.star?'<span class="star">★</span>':''}</span>
        <span class="dots" aria-label="학습 ${b}단계">${[1,2,3,4,5].map(i=>`<i class="${i<=b?'on':''}"></i>`).join('')}</span>
        <span class="m ${bookHide?'hide':''}">${esc(it.m)}</span>
        ${it.sit?`<span class="sit">${esc(it.sit)}</span>`:''}
      </div>`;}).join('')}</div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{bookTab=b.dataset.tab;renderBook();});
  $('#hide').onclick=()=>{bookHide=!bookHide;renderBook();};
  document.querySelectorAll('.item').forEach(r=>r.onclick=()=>{ const m=r.querySelector('.m'); m.classList.toggle('hide'); });
}

$('#home-link').onclick=renderHome;
$('#to-book').onclick=renderBook;
document.addEventListener('keydown',e=>{
  if(!S || e.target.tagName==='INPUT') return;
  if(/^[1-4]$/.test(e.key)){ const b=document.querySelector(`[data-i="${+e.key-1}"]`); if(b && !b.disabled) b.click(); }
  if(e.key==='Enter'){ const n=$('#next'); if(n){ e.preventDefault(); n.click(); } }
});
renderHome();
</script>
